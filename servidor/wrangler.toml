name = "casa-ia-asistente"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Direcciones que pueden usar a MIA, separadas por comas ("*" = cualquiera).
# La pagina publicada, GitHub Pages y la prueba local en la PC.
ORIGEN_PERMITIDO = "https://mia.sistente.workers.dev,https://jordin-garcia.github.io,http://localhost:8080"

# Secretos (NO se escriben aqui). Se configuran con:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CODIGO_ACCESO
# Para pruebas locales, creen el archivo .dev.vars (ver .dev.vars.example)
